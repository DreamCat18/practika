{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-users me-2"></i>Управление клиентами</h4>
        <div>
            <button class="btn btn-light btn-sm me-2" data-bs-toggle="modal" data-bs-target="#importModal">
                <i class="fas fa-file-import me-1"></i>Импорт
            </button>
            <button class="btn btn-light btn-sm me-2" onclick="exportCustomers()">
                <i class="fas fa-file-export me-1"></i>Экспорт
            </button>
            <button class="btn btn-danger btn-sm me-2" onclick="deleteAllCustomers()">
                <i class="fas fa-trash-alt me-1"></i>Удалить всех
            </button>
            <button class="btn btn-light btn-sm" onclick="showAddModal()">
                <i class="fas fa-plus me-1"></i>Добавить
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover" id="customersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>Email</th>
                        <th>Телефон</th>
                        <th>Дата регистрации</th>
                        <th>Заказов</th>
                        <th>Потрачено</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="customersTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal для добавления/редактирования -->
<div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Добавить клиента</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="customerForm">
                    <input type="hidden" id="customerId">
                    <div class="mb-3">
                        <label class="form-label">ФИО *</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="text" class="form-control" id="phone">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Дата регистрации</label>
                        <input type="date" class="form-control" id="registrationDate">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Примечания</label>
                        <textarea class="form-control" id="notes" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveCustomer()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal для импорта -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Импорт клиентов</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="importForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Выберите Excel файл</label>
                        <input type="file" class="form-control" id="importFile" accept=".xlsx,.xls">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="importCustomers()">Импортировать</button>
            </div>
        </div>
    </div>
</div>

<script>
    let customersData = [];

    async function loadCustomers() {
        try {
            const response = await fetch('/api/customers');
            customersData = await response.json();
            const tbody = document.getElementById('customersTableBody');
            tbody.innerHTML = '';

            customersData.forEach(c => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = c.id;
                row.insertCell(1).textContent = c.full_name;
                row.insertCell(2).textContent = c.email;
                row.insertCell(3).textContent = c.phone;
                row.insertCell(4).textContent = c.registration_date;
                row.insertCell(5).textContent = c.total_orders;
                row.insertCell(6).textContent = c.total_spent.toLocaleString() + ' ₽';

                const actions = row.insertCell(7);
                actions.innerHTML = `
                    <button class="btn btn-sm btn-warning me-1" onclick="editCustomer(${c.id})">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${c.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
            });
        } catch(e) {
            console.error(e);
        }
    }

    function showAddModal() {
        document.getElementById('modalTitle').textContent = 'Добавить клиента';
        document.getElementById('customerId').value = '';
        document.getElementById('customerForm').reset();
        document.getElementById('registrationDate').value = new Date().toISOString().split('T')[0];
        new bootstrap.Modal(document.getElementById('customerModal')).show();
    }

    function editCustomer(id) {
        const customer = customersData.find(c => c.id === id);
        if (customer) {
            document.getElementById('modalTitle').textContent = 'Редактировать клиента';
            document.getElementById('customerId').value = customer.id;
            document.getElementById('fullName').value = customer.full_name;
            document.getElementById('email').value = customer.email;
            document.getElementById('phone').value = customer.phone;
            document.getElementById('registrationDate').value = customer.registration_date;
            document.getElementById('notes').value = customer.notes;
            new bootstrap.Modal(document.getElementById('customerModal')).show();
        }
    }

    async function saveCustomer() {
        const id = document.getElementById('customerId').value;
        const data = {
            full_name: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            registration_date: document.getElementById('registrationDate').value,
            notes: document.getElementById('notes').value
        };

        try {
            let response;
            if (id) {
                response = await fetch(`/api/customers/${id}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            } else {
                response = await fetch('/api/customers', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            }

            if (response.ok) {
                bootstrap.Modal.getInstance(document.getElementById('customerModal')).hide();
                loadCustomers();
            }
        } catch(e) {
            console.error(e);
        }
    }

    async function deleteCustomer(id) {
        if (confirm('Вы уверены, что хотите удалить этого клиента?')) {
            try {
                const response = await fetch(`/api/customers/${id}`, {method: 'DELETE'});
                if (response.ok) {
                    loadCustomers();
                }
            } catch(e) {
                console.error(e);
            }
        }
    }

    async function deleteAllCustomers() {
        if (confirm('Вы уверены, что хотите удалить ВСЕХ клиентов и все связанные заказы? Это действие нельзя отменить!')) {
            try {
                const response = await fetch('/api/customers/all', {method: 'DELETE'});
                const result = await response.json();
                if (response.ok) {
                    alert(result.message);
                    loadCustomers();
                } else {
                    alert(result.error || 'Ошибка при удалении');
                }
            } catch(e) {
                console.error(e);
                alert('Ошибка при удалении');
            }
        }
    }

    async function exportCustomers() {
        window.location.href = '/api/export/customers';
    }

    async function importCustomers() {
        const fileInput = document.getElementById('importFile');
        const file = fileInput.files[0];
        if (!file) {
            alert('Выберите файл');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/api/import/customers', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({error: response.statusText}));
                alert(`Ошибка импорта: ${errorData.error || response.statusText}`);
                return;
            }
            
            const result = await response.json();
            alert(result.message);
            bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();
            loadCustomers();
        } catch(e) {
            console.error(e);
            alert(`Ошибка импорта: ${e.message}`);
        }
    }

    loadCustomers();
</script>
{% endblock %}
